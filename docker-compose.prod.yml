version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inubil_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: inubil_backend_prod
    restart: always
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - postgres

volumes:
  postgres_data_prod:
