version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inubil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inubil
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: inubil_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inubil_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inubil_frontend
    restart: unless-stopped
    ports:
      - '4200:4200'
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: inubil_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inubil.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
